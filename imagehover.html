<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
</head>

<body>
    <style>
        body {
            background:hsl(0, 0%, 94%);
            display: flex;
            align-items: center;
            justify-content: stretch;
            min-height: 100vh;
            overflow: hidden;
            font-size: 1em;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica,
                Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol";
            
        }

        ul {
            width: 70%;
            margin: 0;
            padding: 0;
        }

        .container {
            display: inline-block;
            border-bottom: 2px solid hsla(0, 0%, 80%, 0.377);
            
            width: 100%;
            padding: 1rem;
        }

        .container img.swipeimage {
            position: fixed;
            top: 0;
            left: 0;
            width: 350px;
            height: 350px;
            object-fit: cover;
            transform: translateX(-50%) translateY(-50%);
            z-index: 9;
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }
    </style>
    <ul role="list">
        <li class="container">
            <img class="swipeimage" src="https://assets.codepen.io/16327/portrait-image-8.jpg">
            <div class="text">
                <h3>restart reverse scrub pin markers overwrite modifiers</h3>
            </div>
        </li>
        <li class="container">
            <img class="swipeimage" src="https://assets.codepen.io/16327/portrait-image-3.jpg">
            <div class="text">
                <h3>toggleActions start end once refresh from to</h3>
            </div>
        </li>
        <li class="container">
            <img class="swipeimage" src="https://assets.codepen.io/16327/portrait-image-1.jpg">
            <div class="text">
                <h3>ScrollSmoother Flip Draggable SplitText InertiaPlugin</h3>
            </div>
        </li>
        <li class="container">
            <img class="swipeimage" src="https://assets.codepen.io/16327/portrait-image-14.jpg">
            <div class="text">
                <h3>onComplete onUpdate quickSetter quickTo utils.toArray.</h3>
            </div>
        </li>
        <li class="container">
            <img class="swipeimage" src="https://assets.codepen.io/16327/portrait-image-6.jpg">
            <div class="text">
                <h3>Power2 Power3 Power4 Back Elastic Bounce Expo Sine</h3>
            </div>
        </li>
    </ul>
    <script>
        gsap.set(".container img.swipeimage", { yPercent: -50, xPercent: -50 });

        let firstEnter;

        gsap.utils.toArray(".container").forEach((el) => {
            const image = el.querySelector("img.swipeimage"),
                setX = gsap.quickTo(image, "x", { duration: 0.4, ease: "power3" }),
                setY = gsap.quickTo(image, "y", { duration: 0.4, ease: "power3" }),
                align = (e) => {
                    if (firstEnter) {
                        setX(e.clientX, e.clientX); //https://gsap.com/docs/v3/GSAP/gsap.quickTo()/#optionally-define-a-start-value
                        setY(e.clientY, e.clientY);
                        firstEnter = false;
                    } else {
                        setX(e.clientX);
                        setY(e.clientY);
                    }
                },
                startFollow = () => document.addEventListener("mousemove", align),
                stopFollow = () => document.removeEventListener("mousemove", align),
                fade = gsap.to(image, {
                    autoAlpha: 1,
                    ease: "none",
                    paused: true,
                    duration: 0.1,
                    onReverseComplete: stopFollow
                });

            el.addEventListener("mouseenter", (e) => {
                firstEnter = true;
                fade.play();
                startFollow();
                align(e);
            });

            el.addEventListener("mouseleave", () => fade.reverse());
        });

    </script>
</body>

</html>
