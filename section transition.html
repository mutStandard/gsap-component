<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>
</head>

<body>
    <style>
       * {
    margin: 0;
    outline: 0;
    padding: 0;
    box-sizing: border-box;
}

:root {
    --white-050: #ffffff;
    --black-950: #000000;
    --background-color: var(--black-950);  
}
body {
    background: var(--background-color);
}

::-webkit-scrollbar {
  width: 0px;
}

main section.separator {
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
}

main section.separator p {
    color: var(--white-050);
    font-family: sans-serif;
    font-size: 1.2rem;
}

section.content {
    position: relative;
    z-index: 1;
}

main section.content div.section-content {
    background: var(--white-050);
    height: 100vh;
}

main section.content div.section-transition {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    position: absolute;
    width: 100%;
    height: auto;
    left: 0;
}

main section.content div.section-transition {
    bottom: 100%;
    align-items: end;
}

main section.content div.section-transition div.section-transition-div {
    height: 0px;
    background: var(--white-050);   
}
    </style>

   <main>
s
    <section class="separator">
        <p>Scroll</p>
    </section>

    <section class="content">
        <div class="section-transition">
            <div class="section-transition-div" id="section-transition-div_1"></div>
            <div class="section-transition-div" id="section-transition-div_2"></div>
            <div class="section-transition-div" id="section-transition-div_3"></div>
            <div class="section-transition-div" id="section-transition-div_4"></div>
            <div class="section-transition-div" id="section-transition-div_5"></div>
        </div>
        <div class="section-content"></div>
    </section>

</main>
    <script>
      $(document).ready(function () {

    gsap.registerPlugin(ScrollTrigger);

    gsap.to(".separator", {
        scrollTrigger: {
            trigger: ".separator",
            scrub: true,
            start: 'bottom bottom',
            end: 'bottom +=100',
        },
        opacity: "0",
        ease: 'none',
    });

    gsap.to("#section-transition-div_1", {
        scrollTrigger: {
            trigger: ".separator",
            scrub: true,
            start: 'bottom bottom',
            end: 'bottom +=100',
        },
        height: "100px",
        ease: 'none',
    });

    gsap.to("#section-transition-div_2", {
        scrollTrigger: {
            trigger: ".separator",
            scrub: true,
            start: 'bottom bottom',
            end: 'bottom +=100',
        },
        height: "200px",
        ease: 'none',
    });

    gsap.to("#section-transition-div_3", {
        scrollTrigger: {
            trigger: ".separator",
            scrub: true,
            start: 'bottom bottom',
            end: 'bottom +=100',
        },
        height: "400px",
        ease: 'none',
    });

    gsap.to("#section-transition-div_4", {
        scrollTrigger: {
            trigger: ".separator",
            scrub: true,
            start: 'bottom bottom',
            end: 'bottom',
        },
        height: "200px",
        ease: 'none',
    });

    gsap.to("#section-transition-div_5", {
        scrollTrigger: {
            trigger: ".separator",
            scrub: true,
            start: 'bottom bottom',
            end: 'bottom +=100',
        },
        height: "300px",
        ease: 'none',
    });

});
    </script>
</body>

</html>
