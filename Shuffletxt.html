
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>GSAP Shuffle Text</title>

  <!-- Press Start 2P -->
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

  <!-- GSAP -->
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/ScrollTrigger.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/SplitText.min.js"></script>


</head>

<body>

  <style>
    :root {
      --bg: #0a0a0a;
      --text: #ffffff;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Press Start 2P', sans-serif;
      overflow-x: hidden;
    }

    /* -----------------------------------
   Sections
----------------------------------- */

    .hero,
    .demo-section {
      min-height: 100vh;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 40px;
    }

    .demo-section {
      border-top: 1px solid rgba(255, 255, 255, 0.08);
    }


    /* -----------------------------------
   Shuffle parent
----------------------------------- */

    .shuffle-parent {
      display: inline-block;

      white-space: normal;
      word-wrap: break-word;

      line-height: 1;
      font-size: clamp(2rem, 6vw, 4rem);

      font-family: 'Press Start 2P', sans-serif;

      text-transform: uppercase;

      text-align: center;

      visibility: hidden;

      cursor: pointer;

      will-change: transform;
    }

    .shuffle-parent.is-ready {
      visibility: visible;
    }


    /* -----------------------------------
   Character wrapper
----------------------------------- */

    .shuffle-char-wrapper {
      display: inline-block;

      overflow: hidden;

      position: relative;

      vertical-align: bottom;
    }


    /* -----------------------------------
   Character strip
----------------------------------- */

    .shuffle-char-wrapper>span {
      display: inline-block;

      will-change: transform;

      white-space: nowrap;
    }


    /* -----------------------------------
   Characters
----------------------------------- */

    .shuffle-char {
      display: inline-block;

      line-height: 1;

      text-align: center;

      will-change: transform;
    }


    /* -----------------------------------
   Vertical animation
----------------------------------- */

    .shuffle-vertical {
      display: flex !important;

      align-items: center;
      justify-content: center;

      line-height: 1;
    }


    /* -----------------------------------
   Mobile
----------------------------------- */

    @media (max-width: 768px) {

      .hero,
      .demo-section {
        padding: 25px;
      }

      .shuffle-parent {
        font-size: clamp(1.4rem, 7vw, 3rem);
      }

    }


    /* -----------------------------------
   Reduced motion
----------------------------------- */

    @media (prefers-reduced-motion: reduce) {

      .shuffle-parent {
        visibility: visible;
      }

    }
  </style>
  <main>

    <section class="hero">
      <div class="shuffle-parent" data-shuffle data-direction="right" data-duration="0.35" data-stagger="0.03"
        data-shuffle-times="1" data-animation-mode="evenodd" data-scramble="ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789"
        data-color-from="#888888" data-color-to="#ffffff" data-threshold="0.1" data-root-margin="-100px"
        data-loop="false" data-loop-delay="0" data-hover="true" data-trigger-once="true">

        Beyond expectation

      </div>
    </section>


    <section class="demo-section">
      <div class="shuffle-parent" data-shuffle data-direction="left" data-duration="0.45" data-stagger="0.04"
        data-shuffle-times="2" data-animation-mode="evenodd" data-scramble="ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789"
        data-color-from="#888888" data-color-to="#ffffff" data-threshold="0.1" data-root-margin="-100px"
        data-hover="true">

        Always possible

      </div>
    </section>


    <section class="demo-section">
      <div class="shuffle-parent" data-shuffle data-direction="up" data-duration="0.4" data-stagger="0.03"
        data-shuffle-times="2" data-animation-mode="random" data-scramble="01ABCDEFGHIJKLMNOPQRSTUVWXYZ"
        data-color-from="#666666" data-color-to="#ffffff" data-hover="true">

        Digital experiences

      </div>
    </section>

  </main>

  <script>

    gsap.registerPlugin(ScrollTrigger, SplitText);


    /* =========================================================
       SHUFFLE TEXT
    ========================================================= */

    class ShuffleText {

      constructor(element) {

        this.el = element;

        /* -----------------------------------
           Read configuration
        ----------------------------------- */

        this.direction =
          element.dataset.direction || "right";

        this.duration =
          parseFloat(element.dataset.duration || 0.35);

        this.maxDelay =
          parseFloat(element.dataset.maxDelay || 0);

        this.ease =
          element.dataset.ease || "power3.out";

        this.stagger =
          parseFloat(element.dataset.stagger || 0.03);

        this.shuffleTimes =
          Math.max(
            1,
            Math.floor(
              parseFloat(element.dataset.shuffleTimes || 1)
            )
          );

        this.animationMode =
          element.dataset.animationMode || "evenodd";

        this.scrambleCharset =
          element.dataset.scramble || "";

        this.colorFrom =
          element.dataset.colorFrom || "";

        this.colorTo =
          element.dataset.colorTo || "";

        this.loop =
          element.dataset.loop === "true";

        this.loopDelay =
          parseFloat(element.dataset.loopDelay || 0);

        this.triggerOnce =
          element.dataset.triggerOnce !== "false";

        this.triggerOnHover =
          element.dataset.hover !== "false";

        this.threshold =
          parseFloat(element.dataset.threshold || 0.1);

        this.rootMargin =
          element.dataset.rootMargin || "-100px";


        /* -----------------------------------
           State
        ----------------------------------- */

        this.split = null;

        this.wrappers = [];

        this.timeline = null;

        this.playing = false;

        this.hoverHandler = null;

        this.initialText = element.textContent.trim();


        /* -----------------------------------
           Reduced motion
        ----------------------------------- */

        this.reducedMotion =
          window.matchMedia &&
          window.matchMedia(
            "(prefers-reduced-motion: reduce)"
          ).matches;


        /* -----------------------------------
           Initialize
        ----------------------------------- */

        this.waitForFonts();

      }


      /* =========================================================
         WAIT FOR FONTS
      ========================================================= */

      async waitForFonts() {

        if (document.fonts) {

          try {
            await document.fonts.ready;
          } catch (error) {
            console.warn("Font loading failed:", error);
          }

        }

        this.init();

      }


      /* =========================================================
         INITIALIZE
      ========================================================= */

      init() {

        if (!this.el) return;


        /* Reduced motion */

        if (this.reducedMotion) {

          this.el.style.visibility = "visible";

          return;

        }


        const start = this.getScrollStart();


        this.scrollTrigger = ScrollTrigger.create({

          trigger: this.el,

          start: start,

          once: this.triggerOnce,

          onEnter: () => {

            this.create();

          }

        });

      }


      /* =========================================================
         SCROLL START
      ========================================================= */

      getScrollStart() {

        const startPercent =
          (1 - this.threshold) * 100;


        const match =
          /^(-?\d+(?:\.\d+)?)(px|em|rem|%)?$/
            .exec(this.rootMargin || "");


        const value =
          match ? parseFloat(match[1]) : 0;

        const unit =
          match ? match[2] || "px" : "px";


        let offset = "";

        if (value !== 0) {

          offset =
            value < 0
              ? `-=${Math.abs(value)}${unit}`
              : `+=${value}${unit}`;

        }


        return `top ${startPercent}%${offset}`;

      }


      /* =========================================================
         BUILD
      ========================================================= */

      build() {

        this.teardown();


        /* Restore original text */

        this.el.textContent = this.initialText;


        /* -----------------------------------
           Split text
        ----------------------------------- */

        this.split = new SplitText(this.el, {

          type: "chars",

          charsClass: "shuffle-char",

          wordsClass: "shuffle-word",

          linesClass: "shuffle-line",

          smartWrap: true,

          reduceWhiteSpace: false

        });


        const chars = this.split.chars || [];


        this.wrappers = [];


        const rolls = this.shuffleTimes;

        const isVertical =
          this.direction === "up" ||
          this.direction === "down";


        /* -----------------------------------
           Random character
        ----------------------------------- */

        const randomCharacter = () => {

          if (!this.scrambleCharset) {
            return "";
          }

          return this.scrambleCharset.charAt(

            Math.floor(
              Math.random() *
              this.scrambleCharset.length
            )

          );

        };


        /* -----------------------------------
           Create each character
        ----------------------------------- */

        chars.forEach(char => {

          const parent = char.parentElement;

          if (!parent) return;


          const rect =
            char.getBoundingClientRect();


          const width = rect.width;

          const height = rect.height;


          if (!width) return;


          /* -----------------------------------
             Wrapper
          ----------------------------------- */

          const wrapper =
            document.createElement("span");


          wrapper.className =
            "shuffle-char-wrapper";


          Object.assign(wrapper.style, {

            width: `${width}px`,

            height: isVertical
              ? `${height}px`
              : "auto",

            overflow: "hidden",

            display: "inline-block",

            verticalAlign: "bottom"

          });


          /* -----------------------------------
             Inner strip
          ----------------------------------- */

          const inner =
            document.createElement("span");


          Object.assign(inner.style, {

            display: isVertical
              ? "block"
              : "inline-block",

            whiteSpace: "nowrap",

            willChange: "transform"

          });


          /* Insert wrapper */

          parent.insertBefore(
            wrapper,
            char
          );


          wrapper.appendChild(inner);


          /* -----------------------------------
             Original character
          ----------------------------------- */

          const original =
            char.cloneNode(true);


          original.dataset.orig = "1";


          original.classList.add(
            "shuffle-char"
          );


          Object.assign(original.style, {

            display: "inline-block",

            width: `${width}px`,

            height: isVertical
              ? `${height}px`
              : "",

            lineHeight: isVertical
              ? `${height}px`
              : "",

            textAlign: "center"

          });


          /* -----------------------------------
             Scramble copies
          ----------------------------------- */

          const copies = [];


          for (let i = 0; i < rolls; i++) {

            const copy =
              char.cloneNode(true);


            copy.classList.add(
              "shuffle-char"
            );


            if (this.scrambleCharset) {

              copy.textContent =
                randomCharacter();

            }


            Object.assign(copy.style, {

              display: "inline-block",

              width: `${width}px`,

              height: isVertical
                ? `${height}px`
                : "",

              lineHeight: isVertical
                ? `${height}px`
                : "",

              textAlign: "center"

            });


            copies.push(copy);

          }


          /* -----------------------------------
             Build strip
          ----------------------------------- */

          if (
            this.direction === "right" ||
            this.direction === "down"
          ) {

            inner.appendChild(char);

            copies.forEach(copy =>
              inner.appendChild(copy)
            );

            inner.appendChild(original);

          } else {

            inner.appendChild(original);

            copies.forEach(copy =>
              inner.appendChild(copy)
            );

            inner.appendChild(char);

          }


          /* -----------------------------------
             Calculate movement
          ----------------------------------- */

          const steps = rolls + 1;


          let startX = 0;

          let finalX = 0;

          let startY = 0;

          let finalY = 0;


          if (this.direction === "right") {

            startX = -steps * width;

            finalX = 0;

          }

          else if (this.direction === "left") {

            startX = 0;

            finalX = -steps * width;

          }

          else if (this.direction === "down") {

            startY = -steps * height;

            finalY = 0;

          }

          else if (this.direction === "up") {

            startY = 0;

            finalY = -steps * height;

          }


          /* -----------------------------------
             Set initial transform
          ----------------------------------- */

          if (isVertical) {

            gsap.set(inner, {

              x: 0,

              y: startY,

              force3D: true

            });


            inner.dataset.startY =
              startY;

            inner.dataset.finalY =
              finalY;

          }

          else {

            gsap.set(inner, {

              x: startX,

              y: 0,

              force3D: true

            });


            inner.dataset.startX =
              startX;

            inner.dataset.finalX =
              finalX;

          }


          /* -----------------------------------
             Color
          ----------------------------------- */

          if (this.colorFrom) {

            inner.style.color =
              this.colorFrom;

          }


          this.wrappers.push(wrapper);

        });

      }


      /* =========================================================
         RANDOMIZE
      ========================================================= */

      randomizeScrambles() {

        if (!this.scrambleCharset) return;


        this.wrappers.forEach(wrapper => {

          const strip =
            wrapper.firstElementChild;

          if (!strip) return;


          const children =
            Array.from(strip.children);


          children.forEach((child, index) => {

            if (
              index !== 0 &&
              index !== children.length - 1
            ) {

              child.textContent =
                this.scrambleCharset.charAt(

                  Math.floor(
                    Math.random() *
                    this.scrambleCharset.length
                  )

                );

            }

          });

        });

      }


      /* =========================================================
         GET STRIPS
      ========================================================= */

      getStrips() {

        return this.wrappers
          .map(wrapper =>
            wrapper.firstElementChild
          )
          .filter(Boolean);

      }


      /* =========================================================
         PLAY
      ========================================================= */

      play() {

        const strips =
          this.getStrips();


        if (!strips.length) return;


        this.playing = true;


        const isVertical =
          this.direction === "up" ||
          this.direction === "down";


        /* -----------------------------------
           Timeline
        ----------------------------------- */

        const timeline =
          gsap.timeline({

            smoothChildTiming: true,

            repeat:
              this.loop ? -1 : 0,

            repeatDelay:
              this.loop
                ? this.loopDelay
                : 0,

            onRepeat: () => {

              this.randomizeScrambles();


              if (isVertical) {

                gsap.set(

                  strips,

                  {

                    y: (index, target) =>
                      parseFloat(
                        target.dataset.startY || 0
                      )

                  }

                );

              }

              else {

                gsap.set(

                  strips,

                  {

                    x: (index, target) =>
                      parseFloat(
                        target.dataset.startX || 0
                      )

                  }

                );

              }

            },


            onComplete: () => {

              this.playing = false;


              if (!this.loop) {

                this.cleanupToStill();


                if (this.colorTo) {

                  gsap.set(
                    strips,
                    {
                      color: this.colorTo
                    }
                  );

                }

                this.armHover();

              }

            }

          });


        /* -----------------------------------
           Add tween
        ----------------------------------- */

        const addTween =
          (targets, position) => {

            const vars = {

              duration:
                this.duration,

              ease:
                this.ease,

              force3D:
                true,

              stagger:
                this.animationMode === "evenodd"
                  ? this.stagger
                  : 0

            };


            if (isVertical) {

              vars.y = (index, target) =>

                parseFloat(
                  target.dataset.finalY || 0
                );

            }

            else {

              vars.x = (index, target) =>

                parseFloat(
                  target.dataset.finalX || 0
                );

            }


            timeline.to(

              targets,

              vars,

              position

            );


            /* Color animation */

            if (
              this.colorFrom &&
              this.colorTo
            ) {

              timeline.to(

                targets,

                {

                  color:
                    this.colorTo,

                  duration:
                    this.duration,

                  ease:
                    this.ease

                },

                position

              );

            }

          };


        /* =====================================================
           EVEN / ODD
        ===================================================== */

        if (
          this.animationMode === "evenodd"
        ) {

          const odd =
            strips.filter(
              (_, index) =>
                index % 2 === 1
            );


          const even =
            strips.filter(
              (_, index) =>
                index % 2 === 0
            );


          const oddTotal =
            this.duration +
            Math.max(
              0,
              odd.length - 1
            ) *
            this.stagger;


          const evenStart =
            odd.length
              ? oddTotal * 0.7
              : 0;


          if (odd.length) {

            addTween(
              odd,
              0
            );

          }


          if (even.length) {

            addTween(
              even,
              evenStart
            );

          }

        }


        /* =====================================================
           RANDOM
        ===================================================== */

        else {

          strips.forEach(strip => {

            const delay =
              Math.random() *
              this.maxDelay;


            const vars = {

              duration:
                this.duration,

              ease:
                this.ease,

              force3D:
                true

            };


            if (isVertical) {

              vars.y =
                parseFloat(
                  strip.dataset.finalY || 0
                );

            }

            else {

              vars.x =
                parseFloat(
                  strip.dataset.finalX || 0
                );

            }


            timeline.to(

              strip,

              vars,

              delay

            );


            if (
              this.colorFrom &&
              this.colorTo
            ) {

              timeline.fromTo(

                strip,

                {
                  color:
                    this.colorFrom
                },

                {
                  color:
                    this.colorTo,

                  duration:
                    this.duration,

                  ease:
                    this.ease

                },

                delay

              );

            }

          });

        }


        this.timeline =
          timeline;

      }


      /* =========================================================
         CLEANUP
      ========================================================= */

      cleanupToStill() {

        this.wrappers.forEach(wrapper => {

          const strip =
            wrapper.firstElementChild;

          if (!strip) return;


          const original =
            strip.querySelector(
              '[data-orig="1"]'
            );


          if (!original) return;


          strip.replaceChildren(
            original
          );


          gsap.set(
            strip,
            {
              clearProps: "transform"
            }
          );


          strip.style.willChange =
            "auto";

        });

      }


      /* =========================================================
         HOVER
      ========================================================= */

      armHover() {

        if (
          !this.triggerOnHover ||
          !this.el
        ) {
          return;
        }


        this.removeHover();


        this.hoverHandler = () => {

          if (this.playing) return;


          this.build();


          this.randomizeScrambles();


          this.play();

        };


        this.el.addEventListener(
          "mouseenter",
          this.hoverHandler
        );

      }


      /* =========================================================
         REMOVE HOVER
      ========================================================= */

      removeHover() {

        if (
          this.hoverHandler
        ) {

          this.el.removeEventListener(
            "mouseenter",
            this.hoverHandler
          );


          this.hoverHandler =
            null;

        }

      }


      /* =========================================================
         CREATE
      ========================================================= */

      create() {

        this.build();


        this.randomizeScrambles();


        this.play();


        this.armHover();


        this.el.classList.add(
          "is-ready"
        );

      }


      /* =========================================================
         TEARDOWN
      ========================================================= */

      teardown() {

        if (this.timeline) {

          this.timeline.kill();

          this.timeline = null;

        }


        this.removeHover();


        this.wrappers.forEach(wrapper => {

          const strip =
            wrapper.firstElementChild;

          if (!strip) return;


          const original =
            strip.querySelector(
              '[data-orig="1"]'
            );


          if (
            original &&
            wrapper.parentNode
          ) {

            wrapper.parentNode.replaceChild(
              original,
              wrapper
            );

          }

        });


        this.wrappers = [];


        if (this.split) {

          try {

            this.split.revert();

          } catch (error) {

            console.warn(
              "SplitText revert failed:",
              error
            );

          }

        }


        this.split = null;

        this.playing = false;

      }


      /* =========================================================
         DESTROY
      ========================================================= */

      destroy() {

        if (this.scrollTrigger) {

          this.scrollTrigger.kill();

        }


        this.teardown();

      }

    }


    /* =========================================================
       INITIALIZE ALL SHUFFLE ELEMENTS
    ========================================================= */

    document.addEventListener(
      "DOMContentLoaded",
      () => {

        const elements =
          document.querySelectorAll(
            "[data-shuffle]"
          );


        elements.forEach(element => {

          new ShuffleText(element);

        });

      }
    );


  </script>

</body>

</html>
